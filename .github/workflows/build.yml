name: Build Lawnchair Extended Debug APK

on:
  push:
    branches: [ main, my-dev-branch ]  # Builds on main and your dev branch
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger option

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Auto-downloads all submodules (fixes searchuilib forever)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug  # Standard debug build task

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Extended-debug.apk
          path: lawnchair/build/outputs/apk/**/*.apk  # Wildcard to grab any debug APK (common in Lawnchair variants)
          if-no-files-found: error
