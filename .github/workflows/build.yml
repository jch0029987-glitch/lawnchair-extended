name: Build Lawnchair Extended APK

on:
  push:
    branches: [ main, my-dev-branch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the main launcher APK (plawnchair variant – standard for Lawnchair)
        run: ./gradlew assemblePlawnchairDebug

      - name: Show exactly where APKs were built
        run: find . -name "*.apk" -type f || echo "No APK found yet"

      - name: Upload the APK (catches any debug APK in the project)
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Extended-debug.apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            lawnchair/build/outputs/apk/**/*.apk
          if-no-files-found: warn
