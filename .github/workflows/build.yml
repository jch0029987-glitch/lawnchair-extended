name: Build Lawnchair Extended APK

on:
  push:
    branches: [ my-dev-branch, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: List available assemble tasks (for reference)
        run: ./gradlew tasks --all | grep -i assemble

      - name: Build main launcher APK
        run: ./gradlew assembleDebug  # Correct for Lawnchair 15

      - name: Show built APKs
        run: find . -name "*.apk" -type f || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Extended-debug.apk
          path: |
            lawnchair/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn
