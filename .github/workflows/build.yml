name: Build Lawnchair Extended APK

on:
  push:
    branches: [ main, my-dev-branch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: List all available assemble tasks (to find the correct one)
        run: ./gradlew tasks --all | grep -i assemble

      - name: Build standard debug APK (most Lawnchair forks use this)
        run: ./gradlew assembleDebug

      - name: Show exactly where APKs were built
        run: find . -name "*.apk" -type f || echo "No APK found"

      - name: Upload any APK found
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Extended.apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
